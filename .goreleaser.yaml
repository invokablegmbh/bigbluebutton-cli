version: 2
project_name: bigbluebutton-cli
builds:
  - binary: bigbluebutton-cli
    main: .
    ldflags:
      - -s -w -X github.com/invokablegmbh/bigbluebutton-cli/cmd.Version={{.Version}}
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
checksum:
  name_template: 'checksums.txt'
release:
  github:
    owner: bbbserver
    name: bigbluebutton-cli
